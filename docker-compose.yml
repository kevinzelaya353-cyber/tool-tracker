services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tt}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tt_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-tool_tracker}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tt}"]
      interval: 5s
      retries: 10

  # Base de datos efímera para pruebas de integración (en RAM; se borra al detener el contenedor).
  postgres-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tt
      POSTGRES_PASSWORD: tt_test_password
      POSTGRES_DB: tool_tracker_test
    ports:
      - "127.0.0.1:5433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    command: ["postgres", "-c", "fsync=off", "-c", "synchronous_commit=off", "-c", "full_page_writes=off"]
    profiles: ["test"]

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-tt_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-tt_minio_dev_password}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - miniodata:/data

volumes:
  pgdata:
  miniodata:
