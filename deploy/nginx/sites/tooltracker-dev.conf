# /etc/nginx/sites-available/tooltracker-dev  — development NO público: solo 127.0.0.1:8082.
# Acceso desde la PC con un túnel SSH (docs/DEPLOY.md):  ssh -L 8082:127.0.0.1:8082 ubuntu@<vps>  →  http://localhost:8082

server {
    listen 127.0.0.1:8082;
    server_name localhost;

    access_log /var/log/nginx/tooltracker-dev.access.log;
    error_log  /var/log/nginx/tooltracker-dev.error.log;

    root /srv/tooltracker-dev/current/web;
    set $tt_api http://127.0.0.1:4031;
    include snippets/tooltracker-app.conf;
}
