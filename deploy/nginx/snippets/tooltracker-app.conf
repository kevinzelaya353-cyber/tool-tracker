# Común a los dos entornos (se incluye dentro de cada `server`, después de definir `root` y `set $tt_api`).
# La web (export de Expo) es estática; /api, /files, /health y /ready van a la API de Node.

# 5 fotos × 15 MB por subida (POST /api/media) + margen.
client_max_body_size 80m;

add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
add_header X-Frame-Options DENY always;

location ~ ^/(api|files)/ {
    proxy_pass $tt_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;   # el Excel de reportes puede tardar
    proxy_request_buffering off;
}

location = /health { proxy_pass $tt_api; }
location = /ready { proxy_pass $tt_api; }

# Archivos con hash en el nombre: caché larga.
location /_expo/ {
    expires 1y;
    add_header Cache-Control "public, immutable" always;
    try_files $uri =404;
}

# SPA: cualquier otra ruta devuelve index.html (expo-router resuelve en el navegador).
location / {
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    try_files $uri /index.html;
}
