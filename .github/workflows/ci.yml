# Integración continua: lint, tipos, pruebas unitarias e integración contra PostgreSQL real (aplica prisma/migrations).
# Se ejecuta en cada PR hacia develop/main; en los push a esas ramas la invoca deploy.yml antes de desplegar.
name: CI

on:
  pull_request:
    branches: [main, develop]
  workflow_call:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint, tipos y pruebas
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tt
          POSTGRES_PASSWORD: tt_test_password
          POSTGRES_DB: tool_tracker_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U tt"
          --health-interval 5s
          --health-retries 10
    env:
      # Solo para CI: credenciales desechables del contenedor.
      TEST_DATABASE_URL: postgresql://tt:tt_test_password@localhost:5433/tool_tracker_test?schema=public&connection_limit=25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @tt/shared build
      - run: pnpm --filter @tt/api exec prisma validate
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      - run: pnpm --filter @tt/api exec prisma generate
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Pruebas de integración (PostgreSQL real, aplica las migraciones)
        run: pnpm --filter @tt/api test:int
      - name: Auditoría de dependencias
        run: pnpm audit --prod --audit-level high
